@import url("https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap");
.sp{font-family:"Manrope","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:${g.ink};background:${g.bg};-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;letter-spacing:-.005em;}
.sp .serif{font-family:"Instrument Serif",ui-serif,Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.01em}
.sp .soft{box-shadow:0 1px 2px rgba(42,38,35,.03),0 14px 36px -24px rgba(42,38,35,.22)}
.sp *{box-sizing:border-box}
.sp fieldset{min-width:0;margin:0;padding:0;border:0}
.sp button{font:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sp .tabular{font-variant-numeric:tabular-nums}
.sp .tr{transition-property:transform,opacity,background-color,color,border-color,box-shadow;transition-duration:.45s;transition-timing-function:${N}}
.sp .press{transition:transform .28s ${N},background-color .35s ${N},color .35s ${N},box-shadow .35s ${N},border-color .35s ${N},opacity .35s ${N}}
.sp .press:active{transform:scale(.95)}
.sp .lift{transition:transform .45s ${N},box-shadow .45s ${N},border-color .45s ${N}}
@media (hover:hover){.sp .lift:hover{transform:translate3d(0,-3px,0);box-shadow:0 2px 4px rgba(42,38,35,.03),0 22px 44px -24px rgba(42,38,35,.28)}}
.sp .glass{background:rgba(250,249,246,.78);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px)}
.sp .glass-white{background:rgba(255,255,255,.78);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px)}
.sp .hair{box-shadow:0 1px 2px rgba(42,38,35,.03),0 12px 32px -22px rgba(42,38,35,.2)}
.sp .no-scrollbar::-webkit-scrollbar{display:none}.sp .no-scrollbar{scrollbar-width:none}
.sp :focus{outline:none}
.sp :focus-visible{outline:2px solid ${g.brand};outline-offset:2px}
.sp input:not([type=range]):focus-visible,.sp select:focus-visible{outline:none;box-shadow:inset 0 0 0 1.5px rgba(62,87,0,.45)}
.sp .focus-within-ring:focus-within{box-shadow:0 0 0 2px ${g.brand}}

@keyframes spFadeUp{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:none}}
@keyframes spFade{from{opacity:0}to{opacity:1}}
@keyframes spFadeOut{from{opacity:1}to{opacity:0}}
@keyframes spSheetUp{from{transform:translate3d(0,100%,0)}to{transform:none}}
@keyframes spSheetDown{from{transform:none}to{transform:translate3d(0,105%,0)}}
@keyframes spModalIn{from{opacity:0;transform:translate3d(0,28px,0) scale(.96)}to{opacity:1;transform:none}}
@keyframes spModalOut{from{opacity:1;transform:none}to{opacity:0;transform:translate3d(0,18px,0) scale(.98)}}
@keyframes spPop{0%{transform:scale(1)}35%{transform:scale(1.4)}65%{transform:scale(.88)}100%{transform:scale(1)}}
@keyframes spGrow{from{transform:scaleX(0)}}
@keyframes spPulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.55,1.9);opacity:0}}
@keyframes spDot{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spToastIn{from{opacity:0;transform:translate3d(0,18px,0) scale(.95)}to{opacity:1;transform:none}}
@keyframes spFlash{0%{opacity:1}100%{opacity:0}}
@keyframes spDraw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes spTick{0%{opacity:.4;transform:translate3d(0,6px,0)}100%{opacity:1;transform:none}}
@keyframes spShine{0%{transform:translate3d(-120%,0,0)}60%,100%{transform:translate3d(220%,0,0)}}
@keyframes spCardUp{from{opacity:0;transform:translate3d(0,24px,0) scale(.97)}to{opacity:1;transform:none}}

.sp .a-fadeup{animation:spFadeUp .7s ${N} both}
.sp .a-fade{animation:spFade .45s ${N} both}
.sp .a-pop{animation:spPop .55s ${ga}}
.sp .a-grow{transform-origin:0 50%;animation:spGrow 1.2s ${N} both}
.sp .a-pulse{animation:spPulse 2.2s ${N} infinite}
.sp .a-dot{animation:spDot 1.6s ease-in-out infinite}
.sp .a-toast{animation:spToastIn .55s ${ga} both}
.sp .a-flash{animation:spFlash 2.4s ${N} both}
.sp .a-draw{stroke-dasharray:24;animation:spDraw .55s ${N} .25s both}
.sp .a-tick{animation:spTick .3s ${N} both}
.sp .a-shine::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:spShine 3.6s ${N} 1s infinite}
.sp .a-cardup{animation:spCardUp .55s ${ga} both}
.sp .ov-in{animation:spFade .35s ${N} both}
.sp .ov-out{animation:spFadeOut .3s ${N} both}
.sp .sheet-clip{clip-path:inset(0 0 -160px 0 round 24px 24px 0 0)}
@media (min-width:768px){.sp .sheet-clip{clip-path:inset(0 round 24px)}}
.sp .sheet-in{animation:spSheetUp .62s cubic-bezier(.3,1.22,.52,1) both}
.sp .sheet-out{animation:spSheetDown .32s cubic-bezier(.5,0,.75,0) both}
@media (min-width:768px){
  .sp .sheet-in{animation:spModalIn .55s cubic-bezier(.3,1.3,.5,1) both}
  .sp .sheet-out{animation:spModalOut .28s ${N} both}
}

.sp .sp-range{-webkit-appearance:none;appearance:none;height:6px;border-radius:999px;outline:none}
.sp .sp-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:999px;background:#fff;border:1px solid ${g.line};box-shadow:0 4px 14px -4px rgba(42,38,35,.35);transition:transform .3s ${ga};cursor:grab}
.sp .sp-range:active::-webkit-slider-thumb{transform:scale(1.15);cursor:grabbing}
.sp .sp-range::-moz-range-thumb{width:28px;height:28px;border-radius:999px;background:#fff;border:1px solid ${g.line};box-shadow:0 4px 14px -4px rgba(42,38,35,.35)}
.sp .sp-range:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px ${g.ink}}

@media (prefers-reduced-motion:reduce){
  .sp *,.sp *::before,.sp *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
