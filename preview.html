 matcha on the list."},{type:"cafe",cafe:"kaffeine",item:"ka-cold",note:"No milk, all chocolate. For the purists."}]},{id:"j-spot-rosslyn",kind:"spotlight",title:"the tiny counter at the top",dek:"How a standing-room spot by Bank became London's best-rated caf\xE9.",tone:"neutral",published:"2026-11-13",ends:null,body:[{type:"p",text:"There are no tables at Rosslyn. There's a counter, a window and a queue of people in good coats who know exactly what they want."},{type:"p",text:"What they want is milk. The cortado is dense and chocolatey; the flat white is the smoothest in the Square Mile. Both sit at the top of our leaderboard."},{type:"cafe",cafe:"rosslyn",item:"ro-cort",note:"Start here. Two sips in, you'll get it."}]},{id:"j-edit-grey",kind:"edit",title:"where to work when it's grey out",dek:"Bright rooms, good Wi-Fi, no side-eye for staying a while.",tone:"highlight-soft",published:"2026-11-11",ends:null,body:[{type:"p",text:"Some days the laptop has to leave the flat. These are the places that make that feel like a treat."},{type:"cafe",cafe:"prufrock",note:"Huge windows, long benches and a batch brew that keeps coming."},{type:"cafe",cafe:"origin",note:"Roastery energy. Get the V60 and stay for the afternoon."},{type:"cafe",cafe:"storestreet",note:"That skylight. Go before 10 for a table."}]},{id:"j-news-areas",kind:"news",title:"new on the map",dek:"Marylebone, Victoria and South Ken are in. Three new caf\xE9s to rate.",tone:"accent-soft",published:"2026-11-08",ends:null,body:[{type:"p",text:"We've stretched the map west and south. Say hello to three new spots, and tell us what we should add next."},{type:"cafe",cafe:"monocle"},{type:"cafe",cafe:"hagen"},{type:"cafe",cafe:"commonbreads"}]}],drops:[{id:"wh-iced-cardamom",cafe:"watchhouse",name:"Iced Cardamom Latte",type:"drop",label:"limited drop",partner:"WatchHouse \xD7 sam'spresso",ends:"2026-11-22T18:00:00Z",story:"j-drop-cardamom",flavours:["Spiced","Oat-Friendly","Refreshing"]}],picks:["mon-fw","wh-card
